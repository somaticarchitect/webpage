{{ $content := index site.Data.home site.Language.Lang }}
{{ $faq := $content.faq }}
{{ $chevronIcon := "icons/chevron_down.svg" | relURL }}

<section class="faq-section" id="faq">
  <div class="container">
    <div class="faq-content">

      <!-- FAQ Header -->
      <div class="faq-header">
        <span class="faq-eyebrow section-eyebrow">
          {{ $faq.eyebrow }}
        </span>

        <h2 class="faq-title">
          {{ $faq.title }}
        </h2>
      </div>

      <!-- FAQ Accordion -->
      <div class="faq-accordion">

        {{ range $faq.items }}
        <details class="faq-item">

          <summary class="faq-question">
            <span>
              {{ .question }}
            </span>

            <span class="faq-icon" aria-hidden="true">
              <img src="{{ $chevronIcon }}" alt="">
            </span>
          </summary>

          <div class="faq-answer">
            <p>
              {{ .answer }}
            </p>
          </div>

        </details>
        {{ end }}

      </div>

    </div>
  </div>
</section>
