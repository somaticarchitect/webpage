{{ $content := index site.Data.home site.Language.Lang }}
{{ $testimonials := $content.testimonials }}

<section class="testimonials-section" id="testimonials">
  <div class="container">

    <div class="testimonials-header">
      <span class="testimonials-eyebrow section-eyebrow">
        {{ $testimonials.eyebrow }}
      </span>

      <h2 class="testimonials-title">
        {{ $testimonials.title }}
      </h2>
    </div>

    <!-- Testimonials carousel -->
    <div class="testimonials-carousel">

      <div class="testimonials-viewport">
        <div class="testimonials-track">

          {{ range $testimonials.items }}
          <article class="testimonial-card">

            <div class="testimonial-tag pill-tag">
              {{ .tag }}
            </div>

            <blockquote class="testimonial-text">
              {{ .quote }}
            </blockquote>

            <div class="testimonial-author">
              <strong>
                {{ .author }}
              </strong>

              <span>
                {{ .meta }}
              </span>
            </div>

          </article>
          {{ end }}

        </div>
      </div>

      <div
        class="testimonials-dots carousel-dots"
        aria-label="{{ i18n "testimonials_navigation" }}"
      ></div>

    </div>

  </div>
</section>
