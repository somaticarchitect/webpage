<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="logo">QPC<span>.Soma</span></a>
    
    <nav class="main-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    
    <div class="header-right">
      <!-- Перемикач мов -->
      <div class="lang-switch">
        {{ range .AllTranslations }}
          <a href="{{ .RelPermalink }}" class="lang-link">{{ .Language.LanguageName }}</a>
        {{ end }}
      </div>

      <div class="social-links">
        {{ with .Site.Params.threads }}
          <a href="{{ . }}" target="_blank" rel="noopener" aria-label="Threads">Threads</a>
        {{ end }}
        {{ with .Site.Params.youtube }}
          <a href="{{ . }}" target="_blank" rel="noopener" aria-label="YouTube">YouTube</a>
        {{ end }}
      </div>
    </div>
  </div>
</header>
