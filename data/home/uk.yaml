faq:
  eyebrow: "FAQ"
  title: "Запитання перед початком роботи"

  items:
    - question: "Як проходить запис та перша 15-хвилинна знайомча консультація?"
      answer: "Ви залишаєте заявку у формі на сайті або пишете напряму в Telegram чи WhatsApp. Ми узгоджуємо час для короткої 15-хвилинної онлайн-розмови, де обговорюємо ваш запит, наявні затиски або біль, та визначаємо оптимальний формат роботи."

    - question: "Що потрібно підготувати для онлайн-тренування?"
      answer: "Вам знадобиться зручний одяг, що не сковує рухів, килимок для фітнесу/йоги, стабільне інтернет-з'єднання та пристрій (ноутбук, планшет або телефон) із працюючою камерою, встановлений так, щоб вас було видно в повний зріст."

    - question: "Чи можна займатися при протрузіях, грижах або хронічному болю в спині?"
      answer: "Так, соматична робота орієнтована саме на безпечне нейром'язове перенавчання та зняття глибокого компенсаторного спазму, який часто супроводжує грижі та протрузії. Проте, якщо ви перебуваєте в гострому запальному стані, спочатку необхідно зняти гострий біль за рекомендацією лікаря."

    - question: "Чим соматична практика відрізняється від звичайного фітнесу або стретчингу?"
      answer: "Ми не змушуємо м'язи працювати через силу, силові виснажливі навантаження чи болісне механічне розтягування. Робота будується на нейром'язовій саморегуляції, біомеханіці та відновленні природного центрування тіла без втоми й травматизації."

    - question: "Скільки сесій потрібно для відчутного та стійкого результату?"
      answer: "Миттєве зняття напруги та нове відчуття центральної осі нервова система фіксує вже під час першої сесії «Квантового вирівнювання». Для закріплення нових рухових патернів та стійкої перебудови біомеханіки рекомендовано пройти системний курс з 10 занять."

