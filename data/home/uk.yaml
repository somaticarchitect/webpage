hero:
  badge: "КЛІНІЧНА БІОМЕХАНІКА · СОМАТИЧНА АРХІТЕКТУРА"

  title: "Простір відновлення тіла для тих, хто втомився від шаблонного фітнесу"

  subtitle: "Практика на стику біомеханіки, фасціальної провідності та соматосенсорної саморегуляції нервової системи. Рух без виснаження, насильства та болю."

  features:
    - value: "0.1 Гц"
      description: "Синхронізація дихання та ритму"

    - value: "10+"
      description: "Років клінічної практики"

    - value: "3 лінії"
      description: "Фасціальні меридіани"

  image_alt: "Соматична практика та біомеханіка"

  focus:
    eyebrow: "СОМАТИЧНА РЕГУЛЯЦІЯ"
    title: "Відновлення природної архітектури тіла"

about:
  image_alt: "Про метод"

  floating:
    value: "0.1 Hz"
    label: "Протокол синхронізації дихання та серця"

  eyebrow: "ПРО МЕТОД"

  title: "Відновлення ресурсу замість виснаження."

  description:
    - "Мій клінічний досвід виявив постійну проблему: конвенційні тренування створюють дисфункції так само часто, як і усувають їх. «Закачування» ізольованих м'язів без урахування захисних реакцій нервової системи призводить лише до втоми, а не до стійкості."

    - "Метод квантової фізичної культури працює безпосередньо з фасціальними лініями, біомеханікою дихання та автономною регуляцією. В його основі лежить синхронізація серцевого ритму й дихання на частоті 0.1 Гц, що повертає плинність тканин та рідинний баланс по всьому тілу — без механічного навантаження в стані неврологічного стресу."

  features:
    - title: "Неврологічна безпека"
      description: "Рух виключно в безболісному діапазоні без запуску захисних спазмів або гіпернапруги."

    - title: "Тенсегриті та цілісність"
      description: "Балансування натягу по всій фасціальній мережі замість ізоляції та перевантаження окремих м'язів."

    - title: "Індивідуальний скринінг"
      description: "Тестування вихідного стану та неврологічної реактивності перед застосуванням будь-якого навантаження на тіло."

who:
  eyebrow: "ДЛЯ КОГО ЦЕЙ ПІДХІД"

  title: "Кому підходить мій підхід, а кому варто обрати інший формат"

  fit:
    title: "Мій підхід підійде вам, якщо:"
    icon: "icons/checkmark_round.svg"
    items:
      - title: "Науковий підхід:"
        description: "Ви шукаєте глибоке розуміння біомеханіки та фізичної терапії замість поверхневих фітнес-трендів."

      - title: "Робота з причиною:"
        description: "Маєте хронічні затиски, біль у спині чи шиї і прагнете усунути причину, а не лише маскувати симптоми."

      - title: "Системна практика:"
        description: "Готові до нейром'язового перенавчання, соматичної дисципліни та усвідомленої роботи з тілом."

      - title: "Довгостроковий результат:"
        description: "Ваша мета — відновлення внутрішньої когерентності, структурного балансу та легкості руху."

  not_fit:
    title: "Цей формат НЕ підійде вам, якщо:"
    icon: "icons/cross_round.svg"
    items:
      - title: "Шукаєте «магічну таблетку»:"
        description: "Очікуєте, що один сеанс миттєво виправить роки компенсаторних затисків без вашої активної участі."

      - title: "Виснажливий фітнес:"
        description: "Вам потрібен інтенсивний фітнес, виснажливі кардіонавантаження чи марафони швидкого схуднення."

      - title: "Гострі медичні стани:"
        description: "Ви перебуваєте в гострому стані, що потребує термінової медикаментозної чи хірургічної допомоги."

      - title: "Містичні ритуали:"
        description: "Очікуєте езотерики замість чітких законів фізіології, біомеханіки та аналітичного підходу."

