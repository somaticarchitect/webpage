faq:
  eyebrow: "Практичні деталі"
  title: "Поширені запитання"

  items:
    - question: "Чим відрізняються Квантове Вирівнювання і Перебудова Рухових Патернів?"
      paragraphs:
        - "**Квантове Вирівнювання** — це одна завершена 50-хвилинна індивідуальна відновлювальна онлайн-сесія, у якій рух, дихання та тілесна увага поєднуються в практику, адаптовану до вашого поточного стану."

        - "Через м’яке дослідження руху, дихання та тілесну увагу ви отримуєте можливість по-новому відчути своє тіло. Серед можливих ефектів — відчуття легкості, ясності, меншого напруження та більшої тілесної свободи."

        - "**Перебудова Рухових Патернів** — це послідовна програма з дев’яти зустрічей по 70 хвилин: первинне оцінювання та вісім адаптивних занять."

        - "Її цінність — у поступовому розвитку рухових навичок. Ми досліджуємо ваші рухові особливості, працюємо над якістю та контролем обраних рухів, спостерігаємо за змінами й формуємо персональну практику, яку ви можете продовжувати самостійно."

        - "**Головна відмінність:** Квантове Вирівнювання — індивідуальна відновлювальна практика руху, дихання й тілесної уваги під час однієї завершеної сесії, а Перебудова Рухових Патернів — послідовне навчання руху протягом циклу."

        - "Обидва формати самостійні. Один не є обов’язковим етапом перед іншим."

    - question: "Як розпочати індивідуальну роботу?"
      paragraphs:
        - "Напишіть мені в Telegram кілька слів про свій запит і формат, який вас цікавить."

        - "Якщо ви звертаєтеся вперше, перед початком роботи ми проведемо вступну онлайн-розмову. Вона допоможе нам обговорити ваш запит і визначити, чи підходить обраний формат для співпраці."

        - "Перше повідомлення — це початок особистого спілкування, а не автоматичний запис на заняття."

    - question: "Чи проходять усі індивідуальні заняття онлайн?"
      paragraphs:
        - "Так. Зараз і Квантове Вирівнювання, і Перебудова Рухових Патернів проводяться індивідуально онлайн, у форматі 1:1."

        - "Для роботи важливо, щоб я могла бачити ваші рухи через камеру, а ви — чути мої пояснення та надавати зворотний зв’язок під час практики."

    - question: "Що потрібно підготувати для онлайн-заняття?"
      paragraphs:
        - "Підготуйте місце, де ви зможете вільно рухатися, килимок для вправ і зручний одяг, який не обмежує рухів. Бажано, щоб одяг дозволяв добре бачити положення тіла на камері. Камеру потрібно розташувати так, щоб я могла бачити вас на повен зріст."

        - "**Для Квантове Вирівнювання** гімнастична палиця дуже бажана, але не обов’язкова."

        - "**Для Перебудова Рухових Патернів** пряма гімнастична палиця необхідна. Її можна замінити звичайним держаком від швабри. Два блоки для йоги можуть бути корисними, але не є обов’язковими."

        - "Якщо в процесі знадобиться додатковий інвентар, ми обговоримо це індивідуально."


