testimonials:
  eyebrow: "ДОСВІД КЛІЄНТІВ"
  title: "Зміни у відчуттях і русі"

  items:
    - tag: "Спазм у попереку після тривалої роботи за ноутбуком"
      quote: "«Після трьох сесій я помітила те, чого зовсім не очікувала — я перестала напружуватися в очікуванні болю ще до початку руху. Тупе відчуття стискання в попереку, яке я носила з собою два роки, почало поступово зникати. Не драматично, але відчутно й перевірювано.»"
      author: "Олена К."
      meta: "Product Manager, Київ"

    - tag: "Хронічне напруження шиї та плечей через роботу дизайнером"
      quote: "«Найбільше мене здивувало те, як сесії змінили моє сприйняття власної ваги. Раніше я відчував себе важким і скутою конструкцією. Тепер у тому, як я несу себе, з’явилося відчуття простору. До четвертого тижня шия перестала постійно тягнути.»"
      author: "Андрій М."
      meta: "UX Designer, Берлін"

    - tag: "Повторюваний дисбаланс таза та асиметрична хода"
      quote: "«До цього я зверталася до трьох фізіотерапевтів. Вони працювали із симптомами. Тут ми працювали з патерном, який їх спричиняв. До шостої сесії асиметрія, яку мій остеопат відзначав роками, помітно й вимірювано зменшилася.»"
      author: "Дарія В."
      meta: "Архітекторка, Варшава"

    - tag: "Рухливість кульшових суглобів і впевненість у русі"
      quote: "«Тимчасовий текст відгуку для тестування каруселі. Замініть цей текст фінальним відгуком клієнта.»"
      author: "Клієнт 04"
      meta: "Тимчасовий відгук"

    - tag: "Патерн дихання та рухливість грудної клітки"
