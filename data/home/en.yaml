faq:
  eyebrow: "FAQ"
  title: "Questions Before Getting Started"

  items:
    - question: "How does the 15-minute intro call work and how do I book?"
      answer: "You leave a request on the website or message directly via Telegram/WhatsApp. We agree on a convenient time for a short 15-minute online call to discuss your request, current symptoms, and determine if this somatic framework is right for you."

    - question: "What do I need to prepare for an online somatic session?"
      answer: "You need comfortable clothing that allows free movement, a yoga/fitness mat, a stable internet connection, and a device (laptop, tablet, or phone) with a working camera positioned so you are visible full-length."

    - question: "Is this approach suitable for chronic back pain, herniated discs, or protrusions?"
      answer: "Yes. Somatic practice is specifically designed for safe, gentle neuromuscular retraining and removing compensatory spasms around damaged areas. However, if you are in an acute severe medical emergency or intense inflammation, medical clearance is required first."

    - question: "How does somatic practice differ from regular fitness or stretching?"
      answer: "We do not force muscles through aggressive stretching or heavy weight resistance. Instead, we work with nervous system regulation, biomechanics, and body awareness to restore natural alignment without trauma or fatigue."

    - question: "How many sessions are needed to feel a lasting result?"
      answer: "Initial decompression and a sense of lightness are often felt during the very first “Quantum Alignment” session. To permanently rebuild gait patterns, posture, and systemic movement habits, a full 10-session course is recommended."

