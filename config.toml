baseURL = "https://<your-username>.github.io/"
theme = "somatic-theme"

defaultContentLanguage = "uk"
defaultContentLanguageInSubdir = false

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# =========================
# УКРАЇНСЬКА ВЕРСІЯ (UK)
# =========================
[languages.uk]
  languageCode = "uk-ua"
  languageName = "UA"
  weight = 1
  title = "Quantum Physical Culture | Somatic Architecture"
  
  [languages.uk.params]
    author = "Julia"
    tagline = "Somatic Architect & Physical Therapist"
    bio = "Клінічна фізична терапія, біомеханіка, квантова соматика та фреймворк Quantum Physical Culture."
    telegram = "https://t.me/your_telegram"
    whatsapp = "https://wa.me/your_whatsapp_number"
    threads = "https://www.threads.net/@your_threads"
    youtube = "https://www.youtube.com/@your_youtube"

  [[languages.uk.menu.main]]
    identifier = "blog"
    name = "Статті"
    url = "/blog/"
    weight = 10
  [[languages.uk.menu.main]]
    identifier = "mentorship"
    name = "Супровід"
    url = "/mentorship/"
    weight = 20
  [[languages.uk.menu.main]]
    identifier = "shop"
    name = "Матеріали"
    url = "/shop/"
    weight = 30
  [[languages.uk.menu.main]]
    identifier = "contact"
    name = "Контакти"
    url = "/contact/"
    weight = 40

# =========================
# АНГЛІЙСЬКА ВЕРСІЯ (EN)
# =========================
[languages.en]
  languageCode = "en-us"
  languageName = "EN"
  weight = 2
  title = "Quantum Physical Culture | Somatic Architecture"
  
  [languages.en.params]
    author = "Julia"
    tagline = "Somatic Architect & Physical Therapist"
    bio = "Clinical physical therapy, biomechanics, quantum somatics, and the Quantum Physical Culture framework."
    telegram = "https://t.me/your_telegram"
    whatsapp = "https://wa.me/your_whatsapp_number"
    threads = "https://www.threads.net/@your_threads"
    youtube = "https://www.youtube.com/@your_youtube"

  [[languages.en.menu.main]]
    identifier = "blog"
    name = "Articles"
    url = "/en/blog/"
    weight = 10
  [[languages.en.menu.main]]
    identifier = "mentorship"
    name = "Mentorship"
    url = "/en/mentorship/"
    weight = 20
  [[languages.en.menu.main]]
    identifier = "shop"
    name = "Guides"
    url = "/en/shop/"
    weight = 30
  [[languages.en.menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/en/contact/"
    weight = 40
